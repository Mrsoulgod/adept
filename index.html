    <script>
      // Single Page Apps for GitHub Pages
      // If served from repository root on github.io, automatically route to /docs/ where production assets reside
      if (window.location.hostname.endsWith('github.io')) {
        var p = window.location.pathname.replace(/\/+$/, '');
        if (!p.endsWith('/docs') && !p.endsWith('/dist')) {
          window.location.replace(p + '/docs/' + window.location.search + window.location.hash);
        }
      }
    </script>
